name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate packages and contracts
        run: python .github/scripts/validate_repository.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Samples/three-consumer/package-lock.json

      - name: Install Three.js example dependencies
        working-directory: Samples/three-consumer
        run: npm ci

      - name: Test Three.js adapter
        working-directory: Samples/three-consumer
        run: npm test

      - name: Build Three.js consumer example
        working-directory: Samples/three-consumer
        run: npm run build
