<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SceneReplay Three.js Consumer</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">SEMANTIC 3D · LIVE EXAMPLE</p>
      <h1>SceneReplay <span>→ Three.js</span></h1>
      <p class="intro">One editable definition. Native Three.js objects.</p>
      <label for="example-picker">Example</label>
      <select id="example-picker" aria-label="Choose a SceneReplay example">
        <option value="town">Low Poly Japanese Town</option>
        <option value="workbench">Inventor Workbench</option>
        <option value="character">Character assembly</option>
        <option value="weapon">Weapon prop</option>
        <option value="building">Small building</option>
        <option value="profiles">Profile geometry gallery</option>
        <option value="rigged">Semantic rig fixture</option>
      </select>
      <div class="actions">
        <button id="fit-view" type="button">Fit view</button>
        <button id="save-png" type="button">Save PNG</button>
      </div>
      <button id="patch-toggle" type="button" hidden>Raise arm with semantic patch</button>
      <button id="rig-target" type="button" hidden>Resolve humanoid head target</button>
      <p id="status">Loading semantic scene…</p>
      <p class="hint">Drag to orbit · scroll to zoom</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
